<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Track 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui-layer">
      <div id="score-board">
        <div>SCORE: <span id="score">0</span></div>
        <div>BEST: <span id="high-score">0</span></div>
        <div>SPEED: <span id="speed">100</span> MPH</div>
      </div>
      <div id="game-over-screen" class="hidden">
        <h1>SYSTEM OVERLOAD</h1>
        <p>FINAL DISTANCE: <span id="final-score">0</span> PTS</p>
        <button id="restart-btn">RE-ENGAGE (SPACE / TAP)</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
