<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bbBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="orangeGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bbBg)"/>
  <!-- Cyber Hoop Backboard -->
  <rect x="460" y="120" width="180" height="120" rx="8" fill="#0b1120" stroke="#ea580c" stroke-width="4"/>
  <rect x="505" y="160" width="90" height="60" fill="none" stroke="#ea580c" stroke-width="3"/>
  <line x1="490" y1="220" x2="550" y2="220" stroke="#f97316" stroke-width="6" filter="url(#orangeGlow)"/>
  <!-- Flaming Basketball -->
  <circle cx="280" cy="240" r="45" fill="#ea580c" filter="url(#orangeGlow)"/>
  <path d="M235 240 Q280 210 325 240 M280 195 Q310 240 280 285" stroke="#431407" stroke-width="4" fill="none"/>
  <!-- Arc trajectory -->
  <path d="M280 240 Q380 120 520 220" stroke="#ea580c" stroke-width="3" stroke-dasharray="10,8" fill="none" opacity="0.8"/>
  <!-- Title Badge -->
  <rect x="240" y="420" width="320" height="45" rx="10" fill="#0b1120" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#ea580c" text-anchor="middle" letter-spacing="2">BASKETBALL STAR</text>
</svg>