<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="puzBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#puzBg)"/>
  <!-- Puzzle Grid -->
  <g opacity="0.3" stroke="#1e2d4a" stroke-width="2">
    <rect x="250" y="100" width="300" height="300" rx="16" fill="#0b1120"/>
  </g>
  <!-- Glowing Blocks -->
  <rect x="270" y="120" width="60" height="60" rx="8" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="335" y="120" width="60" height="60" rx="8" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="400" y="120" width="60" height="60" rx="8" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="400" y="185" width="60" height="60" rx="8" fill="#8b5cf6" filter="url(#glow)"/>
  <rect x="400" y="250" width="60" height="60" rx="8" fill="#8b5cf6" filter="url(#glow)"/>
  <rect x="465" y="250" width="60" height="60" rx="8" fill="#8b5cf6" filter="url(#glow)"/>
  <rect x="270" y="315" width="60" height="60" rx="8" fill="#f59e0b" filter="url(#glow)"/>
  <rect x="335" y="315" width="60" height="60" rx="8" fill="#f59e0b" filter="url(#glow)"/>
  <!-- Title Badge -->
  <rect x="260" y="425" width="280" height="45" rx="10" fill="#0b1120" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="454" font-family="monospace" font-size="18" font-weight="900" fill="#8b5cf6" text-anchor="middle" letter-spacing="2">BLOCK PUZZLE</text>
</svg>