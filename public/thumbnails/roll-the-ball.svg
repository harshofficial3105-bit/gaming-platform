<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="woodBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d1b0d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="goldGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#woodBg)"/>
  <!-- Wooden Slide Maze -->
  <rect x="240" y="100" width="320" height="280" rx="16" fill="#1c1108" stroke="#78350f" stroke-width="4"/>
  <path d="M280 140 H380 V240 H480 V340" stroke="#d97706" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Rolling Marble -->
  <circle cx="380" cy="240" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#goldGlow)"/>
  <!-- Title Badge -->
  <rect x="260" y="420" width="280" height="45" rx="10" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ROLL THE BALL</text>
</svg>