<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#030208"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f000ff"/>
      <stop offset="100%" stop-color="#7b00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="140" r="1.5" fill="#00f0ff" opacity="0.9"/>
  <circle cx="650" cy="90" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="720" cy="320" r="1.5" fill="#f000ff" opacity="0.8"/>
  <circle cx="180" cy="400" r="2" fill="#00f0ff" opacity="0.6"/>
  <circle cx="500" cy="430" r="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Glowing Cosmic Nebula Grid -->
  <path d="M0 250 Q400 150 800 250" stroke="#00f0ff" stroke-width="1.5" opacity="0.2" fill="none"/>
  <path d="M0 280 Q400 180 800 280" stroke="#f000ff" stroke-width="1.5" opacity="0.2" fill="none"/>
  <!-- Glowing Gems -->
  <polygon points="400,140 430,190 400,240 370,190" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <polygon points="260,280 285,320 260,360 235,320" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <polygon points="540,280 565,320 540,360 515,320" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <!-- Spaceship -->
  <path d="M400 290 L425 360 L400 345 L375 360 Z" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="400,345 408,370 392,370" fill="#00f0ff" filter="url(#glow)"/>
  <!-- Title Badge -->
  <rect x="220" y="400" width="360" height="50" rx="12" fill="#0b1120" stroke="#00f0ff" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="432" font-family="monospace" font-size="18" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="2">SPACE GEM COLLECTOR</text>
</svg>