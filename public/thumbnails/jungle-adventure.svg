<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="jungleBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="emeraldGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#jungleBg)"/>
  <!-- Ancient Maya Temple Ruins -->
  <polygon points="400,140 460,200 340,200" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="300" y="200" width="200" height="50" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <rect x="260" y="250" width="280" height="50" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="220" y="300" width="360" height="60" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <!-- Golden Idol Relic -->
  <circle cx="400" cy="225" r="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" filter="url(#emeraldGlow)"/>
  <!-- Title Badge -->
  <rect x="230" y="420" width="340" height="45" rx="10" fill="#0b1120" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="2">JUNGLE ADVENTURE</text>
</svg>