<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="galBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#galBg)"/>
  <!-- Alien Fleet -->
  <path d="M250 140 L280 180 L220 180 Z" fill="#ef4444" filter="url(#glow)"/>
  <path d="M400 110 L435 160 L365 160 Z" fill="#f59e0b" filter="url(#glow)"/>
  <path d="M550 140 L580 180 L520 180 Z" fill="#ef4444" filter="url(#glow)"/>
  <!-- Lasers -->
  <line x1="390" y1="280" x2="390" y2="200" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>
  <line x1="410" y1="280" x2="410" y2="200" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>
  <!-- Defender Cannon -->
  <polygon points="400,310 440,370 360,370" fill="#00f0ff" filter="url(#glow)"/>
  <!-- Title Badge -->
  <rect x="250" y="420" width="300" height="45" rx="10" fill="#0b1120" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="3">GALAXY SHOOTER</text>
</svg>