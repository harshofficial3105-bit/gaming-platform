<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="invBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="greenGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#invBg)"/>
  <!-- Pixel Invader (8-bit matrix) -->
  <g fill="#10b981" filter="url(#greenGlow)" transform="translate(320, 120) scale(16)">
    <rect x="2" y="0" width="6" height="1"/>
    <rect x="1" y="1" width="8" height="1"/>
    <rect x="0" y="2" width="10" height="1"/>
    <rect x="0" y="3" width="3" height="1"/>
    <rect x="7" y="3" width="3" height="1"/>
    <rect x="0" y="4" width="10" height="1"/>
    <rect x="2" y="5" width="2" height="1"/>
    <rect x="6" y="5" width="2" height="1"/>
    <rect x="1" y="6" width="2" height="1"/>
    <rect x="7" y="6" width="2" height="1"/>
  </g>
  <!-- Defense Cannon -->
  <rect x="375" y="340" width="50" height="20" rx="4" fill="#10b981" filter="url(#greenGlow)"/>
  <rect x="395" y="325" width="10" height="15" fill="#10b981" filter="url(#greenGlow)"/>
  <!-- Title Badge -->
  <rect x="250" y="420" width="300" height="45" rx="10" fill="#0b1120" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="3">SPACE INVADERS</text>
</svg>