<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="fightBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#311010"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <filter id="redGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#fightBg)"/>
  <!-- Arena Stage -->
  <rect x="150" y="360" width="500" height="8" rx="4" fill="#ef4444" filter="url(#redGlow)"/>
  <!-- Fighter 1 (Cyan) -->
  <circle cx="320" cy="220" r="16" fill="#00f0ff"/>
  <line x1="320" y1="236" x2="320" y2="300" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="370" y2="240" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="300" x2="290" y2="360" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="300" x2="350" y2="360" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Fighter 2 (Red) -->
  <circle cx="480" cy="220" r="16" fill="#ef4444"/>
  <line x1="480" y1="236" x2="480" y2="300" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="260" x2="430" y2="250" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="300" x2="510" y2="360" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="300" x2="450" y2="360" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Title Badge -->
  <rect x="250" y="420" width="300" height="45" rx="10" fill="#0b1120" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="450" font-family="monospace" font-size="18" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="2">STICKMAN FIGHT</text>
</svg>